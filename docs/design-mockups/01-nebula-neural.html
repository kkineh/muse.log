<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 Nebula Neural</title></head><body>
<script src="shared.js"></script>
<script>
const S = Muse.init({ no: '01', title: 'Nebula Neural', note: '지금의 뉴럴 그래프 그대로, 뒤에 성운과 별먼지만 깔았습니다. 마우스를 움직이면 깊이별로 다르게 밀립니다.', hint: '노드에 마우스를 올리면 이웃 노드가 밝아집니다 · 클릭하면 글로 이동' });
const { ctx } = S, M = Muse;
const stars = M.stars(260, 7);
const blobs = [
  { c: '#00FFC8', x: .25, y: .3, r: .42, a: .13, sp: .07 },
  { c: '#A78BFA', x: .75, y: .65, r: .5, a: .16, sp: .05 },
  { c: '#38BDF8', x: .55, y: .1, r: .35, a: .09, sp: .09 },
];
const pulses = M.edges.filter(e => e.k === 'tree').map((e, i) => ({ e, p: (i * .37) % 1, v: .12 + (i % 5) * .03 }));
let pos = {};
function layout(t) {
  const f = M.fit(S);
  M.nodes.forEach(n => {
    const bob = n.type === 'root' ? 0 : 1;
    pos[n.id] = {
      x: f.cx + n.ux * f.rx + Math.sin(t * .6 + n.ang * 5) * 5 * bob - S.mouse.nx * 10 * (n.rad),
      y: f.cy + n.uy * f.ry + Math.cos(t * .5 + n.ang * 4) * 5 * bob - S.mouse.ny * 8 * (n.rad),
      r: n.type === 'root' ? 26 : n.type === 'cat' ? 15 : n.type === 'sub' ? 9 : 5.5,
    };
  });
}
function curve(a, b) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
  return { cx: mx - dy * .08, cy: my + dx * .08 };
}
S.onClick((x, y) => { if (S.hover && S.hover.type === 'post') S.go(S.hover); });
S.loop((t) => {
  const { W, H } = S;
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  blobs.forEach((b, i) => {
    const x = (b.x + Math.sin(t * b.sp + i) * .06 - S.mouse.nx * .015) * W, y = (b.y + Math.cos(t * b.sp * 1.3 + i) * .06 - S.mouse.ny * .015) * H;
    M.glow(ctx, x, y, b.r * Math.max(W, H), b.c, b.a);
  });
  ctx.globalCompositeOperation = 'source-over';
  M.drawStars(S, stars, { parallax: 30 });
  layout(t);
  S.hover = M.nearest(M.nodes, S.mouse.x, S.mouse.y, 14, n => pos[n.id]);
  S.cursor(S.hover && S.hover.type === 'post');
  const hn = S.hover ? new Set([S.hover.id, ...M.adj[S.hover.id]]) : null;
  // edges
  M.edges.forEach(e => {
    const a = pos[e.a], b = pos[e.b], na = M.byId[e.a];
    const lit = !hn || (hn.has(e.a) && hn.has(e.b) && (S.hover.id === e.a || S.hover.id === e.b));
    const c = curve(a, b);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(c.cx, c.cy, b.x, b.y);
    if (e.k === 'tag') { ctx.setLineDash([3, 6]); ctx.strokeStyle = M.rgba('#A78BFA', lit ? .45 : .06); }
    else { ctx.setLineDash([]); ctx.strokeStyle = M.rgba(M.colorOf(M.byId[e.b]), lit ? .4 : .07); }
    ctx.lineWidth = lit && hn ? 1.6 : 1; ctx.stroke(); ctx.setLineDash([]);
  });
  // pulses
  pulses.forEach(p => {
    p.p += p.v * .016; if (p.p > 1) p.p = 0;
    const a = pos[p.e.a], b = pos[p.e.b], c = curve(a, b), u = p.p, w = 1 - u;
    const x = w * w * a.x + 2 * w * u * c.cx + u * u * b.x, y = w * w * a.y + 2 * w * u * c.cy + u * u * b.y;
    M.glow(ctx, x, y, 9, M.colorOf(M.byId[p.e.b]), .9);
  });
  // nodes
  M.nodes.forEach(n => {
    const p = pos[n.id], col = M.colorOf(n), dim = hn && !hn.has(n.id) ? .25 : 1;
    ctx.globalAlpha = dim;
    M.glow(ctx, p.x, p.y, p.r * 4.2, col, n.type === 'post' ? .22 : .38);
    ctx.fillStyle = n.type === 'post' ? '#fff' : '#07090e'; ctx.strokeStyle = col; ctx.lineWidth = n.type === 'post' ? 0 : 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); if (n.type !== 'post') ctx.stroke();
    if (n.type === 'root') { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 6.2832); ctx.fill(); }
    if (n.type !== 'post' || (S.hover && S.hover.id === n.id)) {
      ctx.font = (n.type === 'root' ? '600 14px ' : n.type === 'cat' ? '600 13px ' : '500 11px ') + M.FONT;
      ctx.textAlign = 'center'; ctx.fillStyle = n.type === 'sub' ? '#c4b5fd' : '#F0F0F0';
      const txt = n.type === 'post' ? n.label : n.label;
      ctx.fillText(txt, p.x, p.y + p.r + 16);
    }
    ctx.globalAlpha = 1;
  });
});
</script></body></html>
