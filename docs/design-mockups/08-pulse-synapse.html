<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>08 Pulse Synapse</title></head><body>
<script src="shared.js"></script>
<script>
const S = Muse.init({ bg: '#05070c', no: '08', title: 'Pulse Synapse', note: '뉴럴 컨셉을 더 밀어붙인 안입니다. 노드를 누르면 신호가 시냅스를 타고 이웃으로 번지며 불을 켭니다. 가만히 있어도 가끔 저절로 발화합니다.', hint: '노드 클릭: 신호 발화 (글 노드는 두 번째 클릭에서 이동)' });
const { ctx } = S, M = Muse;
const stars = M.stars(120, 4);
const E = M.edges.map(e => ({ ...e, len: 1 }));
const lit = {}; M.nodes.forEach(n => (lit[n.id] = 0));
const sig = []; // {e, from, to, p}
const ripples = [];
let pos = {}, nextAuto = 1.2, lastPost = null;
function fire(id, depth) {
  lit[id] = 1; ripples.push({ id, r: 0 });
  if (depth > 3) return;
  M.adj[id].forEach(nid => {
    const e = E.find(x => (x.a === id && x.b === nid) || (x.a === nid && x.b === id));
    sig.push({ e, from: id, to: nid, p: -(depth * .0) , delay: 0, depth: depth + 1 });
  });
}
S.onClick(() => {
  const h = S.hover; if (!h) return;
  if (h.type === 'post' && lastPost === h.id) return S.go(h);
  lastPost = h.type === 'post' ? h.id : null; fire(h.id, 0);
});
S.loop((t, dt) => {
  const { W, H } = S, f = M.fit(S);
  ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, W, H);
  M.glow(ctx, W / 2, H / 2, Math.min(W, H) * .6, '#143a52', .35);
  M.drawStars(S, stars, { parallax: 8, alpha: .6 });
  M.nodes.forEach(n => {
    pos[n.id] = { x: f.cx + n.ux * f.rx + Math.sin(t * .7 + n.ang * 6) * 3, y: f.cy + n.uy * f.ry + Math.cos(t * .6 + n.ang * 5) * 3, r: n.type === 'root' ? 22 : n.type === 'cat' ? 13 : n.type === 'sub' ? 8 : 5 };
  });
  S.hover = M.nearest(M.nodes, S.mouse.x, S.mouse.y, 12, n => pos[n.id]);
  S.cursor(!!S.hover);
  if (t > nextAuto) { nextAuto = t + 2.2 + Math.random() * 2; fire(M.nodes[Math.floor(Math.random() * M.nodes.length)].id, 1); }
  // 시냅스
  E.forEach(e => {
    const a = pos[e.a], b = pos[e.b], act = Math.max(lit[e.a], lit[e.b]);
    const col = M.colorOf(M.byId[e.b]);
    ctx.strokeStyle = M.rgba(col, .1 + act * .5); ctx.lineWidth = .8 + act * 1.4;
    ctx.setLineDash(e.k === 'tag' ? [2, 6] : []);
    const mx = (a.x + b.x) / 2 - (b.y - a.y) * .1, my = (a.y + b.y) / 2 + (b.x - a.x) * .1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
    e.q = { mx, my };
  });
  // 신호
  for (let i = sig.length - 1; i >= 0; i--) {
    const s = sig[i]; s.p += dt * 1.6;
    if (s.p < 0) continue;
    const a = pos[s.from], b = pos[s.to], q = s.e.q, u = Math.min(1, s.p), w = 1 - u;
    const x = w * w * a.x + 2 * w * u * q.mx + u * u * b.x, y = w * w * a.y + 2 * w * u * q.my + u * u * b.y;
    ctx.globalCompositeOperation = 'lighter';
    M.glow(ctx, x, y, 16, M.colorOf(M.byId[s.to]), 1);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.2832); ctx.fill();
    if (s.p >= 1) { sig.splice(i, 1); if (lit[s.to] < .6) fire(s.to, s.depth); else lit[s.to] = 1; }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.r += dt * 70; const p = pos[r.id], al = Math.max(0, 1 - r.r / 60);
    ctx.strokeStyle = M.rgba(M.colorOf(M.byId[r.id]), al * .8); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + r.r, 0, 6.2832); ctx.stroke();
    if (al <= 0) ripples.splice(i, 1);
  }
  M.nodes.forEach(n => {
    const p = pos[n.id], col = M.colorOf(n), l = lit[n.id]; lit[n.id] = Math.max(0, l - dt * .6);
    ctx.globalCompositeOperation = 'lighter'; M.glow(ctx, p.x, p.y, p.r * (3 + l * 4), col, .2 + l * .7); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = M.rgba(col, .12 + l * .8);
    ctx.strokeStyle = M.rgba(col, .5 + l * .5); ctx.lineWidth = n.type === 'post' ? 1 : 1.8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + l * .25), 0, 6.2832); ctx.fill(); ctx.stroke();
    if (n.type !== 'post' || S.hover === n || l > .4) {
      ctx.font = (n.type === 'post' ? '' : '600 ') + (n.type === 'root' ? 13 : 11) + 'px ' + M.FONT; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,' + (.7 + l * .3) + ')';
      ctx.fillText(n.type === 'post' ? M.short(n.label, 20) : n.label, p.x, p.y + p.r + 16);
    }
  });
});
</script></body></html>
